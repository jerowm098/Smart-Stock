# ====================================================================
#  Render Blueprint (render.yaml)
#
#  Ito ay "Infrastructure as Code" - ang buong deployment setup ay
#  nasa code form. Pag na-upload mo ito sa root ng repo, pwede mong
#  i-deploy gamit ang "Blueprint" na option sa Render dashboard:
#
#     render.com -> New + -> Blueprint -> Connect your repo
#
#  NOTE: Smart-Stock now uses Supabase PostgreSQL (no SQLite).
#  Kailangan mong i-set sa Render Dashboard > Environment:
#    - APP_KEY (sync false, secret)
#    - DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSLMODE
#  Huwag i-commit ang DB_PASSWORD sa repo.
# ====================================================================

services:
  - type: web
    name: Smart-Stock
    runtime: docker
    plan: free
    region: singapore  # malapit sa Pilipinas; pwede mong palitan
    branch: main

    # Awtomatikong madi-detect ng Render ang Dockerfile sa repo root
    dockerfilePath: ./Dockerfile

    healthCheckPath: /
    autoDeploy: true

    envVars:
      # --- Laravel essentials ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # --- Supabase PostgreSQL (primary, walang SQLite) ---
      # Kunin sa Supabase Dashboard > Settings > Database > Connection string
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- SESSION/CACHE sa file ---
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: "sync"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"

      # --- APP_KEY ---
      # MAHALAGA: para manatiling valid ang mga session/encryption
      # sa bawat deploy, i-set ang APP_KEY sa dashboard o dito.
      # Generate: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # APP_URL should match the deployed domain so Laravel generates
      # fully-qualified HTTPS URLs (forms, links, redirects).
      # Change the value below to your actual Render service name.
      - key: APP_URL
        value: https://smart-stock-4lav.onrender.com
