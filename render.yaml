# ====================================================================
#  Render Blueprint (render.yaml)
#
#  Ito ay "Infrastructure as Code" - ang buong deployment setup ay
#  nasa code form. Pag na-upload mo ito sa root ng repo, pwede mong
#  i-deploy gamit ang "Blueprint" na option sa Render dashboard:
#
#     render.com -> New + -> Blueprint -> Connect your repo
#
#  NOTE: Smart-Stock now uses Supabase PostgreSQL (no SQLite).
#  Project region = Tokyo (ap-northeast-1), kaya pooler host ay
#  aws-0-ap-northeast-1.pooler.supabase.com (hindi southeast).
#  Ang DB_HOST/DB_USERNAME ay naka-commit na bilang default para
#  hindi blanko ang fresh deploy. Ang sekreto lang (APP_KEY,
#  DB_PASSWORD) ang sync:false at manual sa dashboard.
#  Huwag i-commit ang DB_PASSWORD sa repo.
# ====================================================================

services:
  - type: web
    name: Smart-Stock
    runtime: docker
    plan: free
    region: singapore  # malapit sa Pilipinas; pwede mong palitan
    branch: main

    # Awtomatikong madi-detect ng Render ang Dockerfile sa repo root
    dockerfilePath: ./Dockerfile

    healthCheckPath: /
    autoDeploy: true

    envVars:
      # --- Laravel essentials ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # --- Supabase PostgreSQL Tokyo (primary, walang SQLite) ---
      # Kunin sa Supabase Dashboard > Connect > Transaction Pooler > URI
      # PROD runtime = Transaction pooler 6543 (hindi Session, hindi Direct)
      # Homepage/Login GET ay walang DB kaya 200 kahit blanko ang DB vars.
      # POST login/register ay nag-500 pag blanko/mali ang DB vars.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.vxmyfozpixzbobwnfziq
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- SESSION/CACHE/QUEUE sa file/sync (hindi database) ---
      # MAHALAGA: pag database ang default at wala pang sessions/cache/jobs
      # table sa Supabase, mag-500 ang GET /login. Kaya file/sync dito.
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_MAINTENANCE_STORE
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"

      # --- APP_KEY ---
      # MAHALAGA: para manatiling valid ang mga session/encryption
      # sa bawat deploy, i-set ang APP_KEY sa dashboard o dito.
      # Generate: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # APP_URL should match the deployed domain so Laravel generates
      # fully-qualified HTTPS URLs (forms, links, redirects).
      # Palitan kung iba ang service name mo (katulad ng smart-stock-4lav).
      - key: APP_URL
        value: https://smart-stock-4lav.onrender.com
