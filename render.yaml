# ====================================================================
#  Render Blueprint (render.yaml)
#
#  Simple SQLite-based deployment
# ====================================================================

services:
  - type: web
    name: Smart-Stock
    runtime: docker
    plan: free
    region: singapore
    branch: main

    dockerfilePath: ./Dockerfile

    healthCheckPath: /
    autoDeploy: true

    envVars:
      # --- Laravel essentials ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # --- SESSION/CACHE sa file (walang external DB na kailangan) ---
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: "null"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"

      # --- APP_KEY ---
      # MAHALAGA: para manatiling valid ang sessions/encryption
      # Generate: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # APP_URL should match the deployed domain
      - key: APP_URL
        value: https://smart-stock.onrender.com
