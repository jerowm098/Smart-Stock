# ====================================================================
#  Render Blueprint (render.yaml)
#
#  Ito ay "Infrastructure as Code" - ang buong deployment setup ay
#  nasa code form. Pag na-upload mo ito sa root ng repo, pwede mong
#  i-deploy gamit ang "Blueprint" na option sa Render dashboard:
#
#     render.com -> New + -> Blueprint -> Connect your repo
#
#  !!! PAALALA (nangyari na ito): ang Blueprint ay LAGING gumagawa ng
#      BAGONG service na may bagong random URL (e.g. smart-stock-v3wy).
#      Hindi nito ina-update ang lumang service, at hindi rin napapalitan
#      ng APP_URL sa ibaba ang URL ng service - ang URL ay galing sa
#      service name sa paggawa pa lang.
#      PARA MANATILI ANG LUMANG URL: huwag gumamit ng Blueprint ulit -
#      sa EXISTING service lang mag-"Manual Deploy > Deploy latest commit"
#      (Dashboard > <service> > Manual Deploy).
#
#  NOTE: Smart-Stock now uses Supabase PostgreSQL (no SQLite).
#  Kailangan mong i-set sa Render Dashboard > Environment:
#    - APP_KEY (sync false, secret)
#    - DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSLMODE
#  Huwag i-commit ang DB_PASSWORD sa repo.
# ====================================================================

services:
  - type: web
    name: Smart-Stock
    runtime: docker
    plan: free
    region: singapore  # malapit sa Pilipinas; pwede mong palitan
    branch: main

    # Dockerfile sa repo root: nagbe-build ng Laravel API + React SPA
    # (context = buong repo para maabot ang backend/ at frontend/)
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /
    autoDeploy: true

    envVars:
      # --- Laravel essentials ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # --- Supabase PostgreSQL (primary, walang SQLite) ---
      # Kunin sa Supabase Dashboard > Connect > "Session pooler" string.
      #   DB_HOST     = aws-0-<region>.pooler.supabase.com   (SESSION pooler!)
      #   DB_PORT     = 5432   (Session pooler - kaya tumatakbo ang auto-migrate)
      #   DB_DATABASE = postgres
      #   DB_USERNAME = postgres.<project-ref>   (may prefix na "<ref>"!)
      #   DB_PASSWORD = <Supabase DB password>
      # Ang mga may `sync: false` ay hihingin sa Blueprint setup screen -
      # DO NOT leave them blank, dahil dahan-dahang mag-500 ang login.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- SESSION/CACHE sa file ---
      # NOTE: 'file' driver is safe here kasi Render spins up ONE container
      # (nginx+php-fpm share it via supervisor), so lahat ng php-fpm workers
      # ay may iisang session store. Kung magka-multiple instance ka, ilipat
      # sa 'database' driver para hindi mawala ang session sa restart.
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file

      # 'null' ay VALID - Laravel registers it as the NullConnector
      # (vendor/laravel/framework/src/Illuminate/Queue/QueueServiceProvider.php),
      # meaning "huwag mag-enqueue, i-drop ang jobs". Ito ang pinaka-ligtas sa
      # free plan dahil walang queue worker at hindi ka mag-hang ng jobs.
      # ('sync' ay rin valid, pero 'null' ang default natin sa Dockerfile.)
      - key: QUEUE_CONNECTION
        value: "null"

      # Cookies: secure lang sa HTTPS (Render's default), http-only para sa
      # XSS, at 'lax' same-site para makapasok ang session sa POST /login
      # pagkatapos ng redirect mula sa Cloudflare/Render edge.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"
      # NOTE: huwag mag-set ng SESSION_DOMAIN. Kapag wala ito, gumagamit ang
      # Laravel ng host ng request, kaya nananatiling wasto ang cookie kahit
      # binago ang domain ng Render service.

      # --- APP_KEY ---
      # MAHALAGA: para manatiling valid ang mga session/encryption
      # sa bawat deploy, i-set ang APP_KEY sa dashboard o dito.
      # Kung blank/iwanan: auto-generate ng entrypoint sa unang boot
      # (ok lang ito - session cookies lang ang maa-reset pag nag-redeploy
      # nang walang key). Generate: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # APP_URL should match the deployed domain so Laravel generates
      # fully-qualified HTTPS URLs (forms, links, redirects).
      # NOTE: ito ay DITO lang sa service na ito tama kung iyon ang
      # pinapa-deploy mo. Hindi nito kontrolado ang URL ng service -
      # tingnan ang PAALALA sa taas. I-edit kung nagiba ang service.
      - key: APP_URL
        value: https://smart-stock-4lav.onrender.com
