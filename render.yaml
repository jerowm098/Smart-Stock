# ====================================================================
#  Render Blueprint (render.yaml)
#
#  Ito ay "Infrastructure as Code" - ang buong deployment setup ay
#  nasa code form. Pag na-upload mo ito sa root ng repo, pwede mong
#  i-deploy gamit ang "Blueprint" na option sa Render dashboard:
#
#     render.com -> New + -> Blueprint -> Connect your repo
#
#  Maaari din itong gamitin sa "Blueprints" na service ng Render
#  (dati tinatawag na "Blueprint plan").
#
#  PAMALITAN MO LANG ANG MGA SUMUSUNOD PAGKATAPOS I-COMMIT:
#    - SUPABASE_URL at SUPABASE_ANON_KEY -> i-add mo sa Render env
#    - Kaya mo ring i-set ang APP_KEY dito para laging pareho
# ====================================================================

services:
  - type: web
    name: Smart-Stock
    runtime: docker
    plan: free
    region: singapore  # malapit sa Pilipinas; pwede mong palitan
    branch: main

    # Awtomatikong madi-detect ng Render ang Dockerfile sa repo root
    dockerfilePath: ./Dockerfile

    healthCheckPath: /
    autoDeploy: true

    envVars:
      # --- Laravel essentials ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # --- Supabase (PostgREST) ---
      # INGAT: huwag ilagay ang totoong key dito kung public ang repo!
      # Sa halip, i-set ito sa Render dashboard:
      #   Render -> Web Service -> Environment -> Secret Files / Env
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # --- SESSION/CACHE sa file (walang database na kailangan) ---
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: "null"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: "lax"
      # Note: SESSION_DRIVER is auto-switched to 'database' in entrypoint.sh
      # when SUPABASE_PG_URL is set

      # --- Supabase PostgreSQL (user auth & session storage) ---
      # Format: postgresql://postgres.vxmyfozpixzbobwnfziq:YOUR_PASSWORD@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: SUPABASE_PG_URL
        sync: false
      - key: SUPABASE_PG_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: SUPABASE_PG_PORT
        value: "5432"
      - key: SUPABASE_PG_DATABASE
        value: postgres
      - key: SUPABASE_PG_USER
        value: "postgres.vxmyfozpixzbobwnfziq"
      - key: SUPABASE_PG_PASSWORD
        sync: false

      # --- Session storage (use database for persistent sessions on ephemeral storage) ---
      # When SUPABASE_PG_URL is set, Laravel will auto-detect and use 'database' session driver
      # Otherwise defaults to 'file' in Dockerfile
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_TABLE
        value: sessions
      - key: SESSION_LIFETIME
        value: "120"
      
      # --- Supabase Schema Admin (uses SUPABASE_ANON_KEY as admin token) ---
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- APP_KEY ---
      # MAHALAGA: para manatiling valid ang mga session/encryption
      # sa bawat deploy, i-set ang APP_KEY sa dashboard o dito.
      # Generate: php artisan key:generate --show
      - key: APP_KEY
        sync: false

      # APP_URL should match the deployed domain so Laravel generates
      # fully-qualified HTTPS URLs (forms, links, redirects).
      # Change the value below to your actual Render service name.
      - key: APP_URL
        value: https://smart-stock.onrender.com