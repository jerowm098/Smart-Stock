<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Stock — Intelligent Inventory System</title>
    <script>
        // Anti-flash: i-set ang theme bago pa ma-render ang kahit ano.
        // Dark ang default; ang saved preference lang ang naka-override.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('smart-stock-theme'); } catch (e) {}
            document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
