# ------------------------------------------------------------------
# Security headers (OWASP ZAP hardening) para sa SPA shell + static assets.
#
# BAKIT HIWALAY NA FILE: sa nginx, kapag may `add_header` ang isang
# location block, NAWAWALA lahat ng `add_header` na minana mula sa
# server block. Kaya ini-include ito sa BAWAT location na may add_header.
#
# Ang /api/* ay may sariling headers mula sa Laravel
# (App\Http\Middleware\SecurityHeaders).
#
# CSP script-src hashes = ang inline anti-flash theme script sa
# frontend/index.html (LF at CRLF variants). Kapag binago mo ang script na
# iyon, i-recompute ang hash (tingnan ang frontend/vite.config.js).
# ------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FyJR/IFo4LEIg8OyzuArYKlnDlzwzQ5//fO6jl26PpY=' 'sha256-NQoc+TGrcC6RxnckgwQKr+PFU8/WoTNJ07I+SdZksG4='; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
