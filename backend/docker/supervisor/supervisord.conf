; ------------------------------------------------------------------
; Supervisor - humahawak sa dalawang process sa loob ng isang container:
;   1. php-fpm  (nagpapatakbo ng Laravel)
;   2. nginx    (web server / reverse proxy)
;
; Bakit kailangan? Ang Docker ay nagpapatakbo lang ng ISANG main process.
; Kailangan natin ng dalawa, kaya si supervisor ang magiging main process.
; ------------------------------------------------------------------

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0