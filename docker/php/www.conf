; ------------------------------------------------------------------
; PHP-FPM pool config para sa Laravel app
;
; clear_env = no ==> Namamana ng php-fpm workers ang environment
; variables ng container. Kaya nakikita ng Laravel ang mga env var
; mula sa Render (SUPABASE_URL, SUPABASE_ANON_KEY, APP_KEY, atbp.)
;
; NOTE: Ang file na ito ay pinapalitan ang default na www.conf ng
; php:8.3-fpm image, at inaalis ang zz-docker.conf (na nagse-set ng
; listen = 9000 na makakasira sa socket config).
; ------------------------------------------------------------------

[www]
user = www-data
group = www-data

; Unix socket - mas mabilis at secure kaysa TCP (127.0.0.1:9000)
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

; Importante para sa Render: namamana ang lahat ng env vars
clear_env = no

; Conservative settings para sa 512MB free instance ng Render
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

request_terminate_timeout = 60s

; Limitasyon sa memory - 128M ay sapat na para sa Laravel
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 60

; Isama ang worker errors/output sa php-fpm logs
catch_workers_output = yes